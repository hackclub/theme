version: 2
updates:
  - package-ecosystem: 'bun'
    directories:
      - '/'
      - '/docs'
      - '/packages/*'
    schedule:
      interval: 'weekly'
    groups:
      dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
